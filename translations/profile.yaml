# Repository profile for the `doc-translation` skill (field meanings: <skill>/references/profile-spec.md).
# Human-owned: the runs never edit this file.
schema: 1
repo: repos/omniroute-docs                 # relative to RUN_DIR (the monorepo root, where runs start); every other path below is relative to this repo
translationsRoot: translations
defaultLocale: zh-CN
locales:
  zh-CN:
    name: "简体中文"
    cjk: true
    notes: "读者称“你”不称“您”;全角标点;中英文与数字之间加半角空格;技术文档,语气书面、克制。"
  zh-Hant:
    name: "繁體中文"
    cjk: true
    notes: "使用台灣慣用詞彙與全形標點;中英文與數字之間加半形空格;語氣書面、克制。"
  de-DE:
    name: "Deutsch"
    cjk: false
    notes: ""
  es-ES:
    name: "Español"
    cjk: false
    notes: ""
  fr-FR:
    name: "Français"
    cjk: false
    notes: ""
  ja-JP:
    name: "日本語"
    cjk: true
    notes: ""
  ko-KR:
    name: "한국어"
    cjk: true
    notes: ""
  pt-BR:
    name: "Português (Brasil)"
    cjk: false
    notes: ""
  ru-RU:
    name: "Русский"
    cjk: false
    notes: ""

sources:
  description: >-
    OmniRoute upstream English documentation — every English Markdown under `docs/` of the pinned
    `vendor/OmniRoute` submodule plus its root `README.md` (the same set the site publishes; see
    `docs/upstream-route-map.md`).
  discovery:
    cwd: .                                 # relative to the repo
    command: node translations/discover.mjs --locale {locale}
  extensions: [.md]

externalTranslations:
  policy: skip                             # upstream already translated these; never translate or rewrite them
  evidence:
    - vendor/OmniRoute/docs/i18n/{locale}/ # read-only; quality unverified, so terminology evidence only

writeScope: [translations/]
readOnly:
  - vendor/                                # pinned upstream submodule, including docs/i18n/
  - src/content/docs/                      # generated and Git-ignored
  - src/content/upstream-translation-reviews.json
  - scripts/
  - src/
  - test/
  - astro.config.mjs
  - package.json
  - package-lock.json
forbidden:
  - repos/hagicode-local-deployment/.generated/environments/dev-a   # the owner's live deployment: no reads, writes, restarts, kills
  - git push / stash / reset / checkout / new branches / --no-verify
  - npm install, pnpm install, builds, tests, long-running services
  - killing processes by name

priority:
  - { tier: 1, match: ["README.md", "docs/getting-started/", "docs/guides/"] }
  - { tier: 2, match: ["docs/routing/", "docs/security/", "docs/reference/"] }
  - { tier: 4, match: ["docs/changelog/", "docs/assets/"] }

budgets:
  maxRunMinutes: 240
  maxDocs: 10
  maxSourceBytes: 80000
  minMinutesToStartDoc: 20

commit:
  enabled: true
  messagePrefix: "docs(translation)"
  trailer: "Co-Authored-By: Hagicode <noreply@hagicode.com>"   # what this repo's own history uses; the commit-msg hook that rejects AI attribution lives only inside vendor/OmniRoute and does not apply here

timezone: America/Los_Angeles

rules:
  doNotTranslateSeeds: [OmniRoute, HagiCode]
  links: Keep relative links unchanged; the site importer rewrites them.
  frontmatterTranslatable: [title, description]
  extra:
    - Do not translate comments inside fenced code blocks (code blocks are verified byte-for-byte).
    - Do not add the upstream language-switcher bar or a "(中文 (简体))" suffix to titles.
    - Node commands use NODE_OPTIONS=--max-old-space-size=24576; anything that may hang runs under `timeout -k 30 <seconds>`.
    - Other sessions may share this worktree and git index; run `git status` first and only ever touch `translations/`.
    - Scratch files go to the session scratchpad (or a `mktemp -d` outside the repo), never into the repo or `vendor/OmniRoute/_artifacts/`.
    - Running the skill's own `scripts/selftest.mjs` is allowed; it is not a repository build or test.
